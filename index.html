<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANNA RACHIM</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161618;
            --card-border: #26262a;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --accent: #ffffff;
            --modal-bg: #1c1c1e;
        }

        body.light-theme {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --card-border: #e5e5ea;
            --text-main: #000000;
            --text-sub: #6c6c70;
            --accent: #000000;
            --modal-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            cursor: pointer;
            position: relative;
        }

        .card:active {
            transform: scale(0.98);
        }

        .icon {
            font-size: 20px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title {
            font-size: 18px;
            font-weight: 600;
        }

        .description {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.4;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--modal-bg);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid var(--card-border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 20px;
            cursor: pointer;
        }

        .profile-avatar-container {
            display: flex;
            justify-content: center;
            margin: 8px 0;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--card-border);
            object-fit: cover;
            cursor: pointer;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-sub);
        }

        .input-group input {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .theme-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-top: 1px solid var(--card-border);
            font-size: 14px;
        }

        .btn-save {
            background: var(--text-main);
            color: var(--bg-color);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">ANNA RACHIM</div>

        <div class="card">
            <div class="icon">✦</div>
            <div class="title">AI Assistant</div>
            <div class="description">Твой интеллектуальный помощник. Скоро здесь появится AI.</div>
        </div>

        <div class="card">
            <div class="icon">◇</div>
            <div class="title">Мои проекты</div>
            <div class="description">Создавай и сохраняй свои идеи в одном месте.</div>
        </div>

        <div class="card" id="profileCard">
            <div class="icon">◎</div>
            <div class="title" id="profileTitle">Профиль</div>
            <div class="description" id="profileDesc">Настрой своё имя, username и внешний вид профиля.</div>
        </div>

        <div class="card">
            <div class="icon">↗</div>
            <div class="title">Активность</div>
            <div class="description">Здесь будет отображаться твоя активность.</div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <span>Редактировать профиль</span>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>

            <div class="profile-avatar-container">
                <img src="https://via.placeholder.com/80" id="avatarPreview" class="profile-avatar" alt="Avatar" onclick="document.getElementById('avatarInput').click()">
                <input type="file" id="avatarInput" accept="image/*" style="display: none;">
            </div>

            <div class="input-group">
                <label>Имя</label>
                <input type="text" id="nameInput" placeholder="Введи имя">
            </div>

            <div class="input-group">
                <label>Username</label>
                <input type="text" id="usernameInput" placeholder="@username">
            </div>

            <div class="theme-toggle">
                <span>Светлая тема</span>
                <input type="checkbox" id="themeSwitch">
            </div>

            <button class="btn-save" id="saveProfileBtn">Сохранить</button>
        </div>
    </div>

    <script>
        const profileCard = document.getElementById('profileCard');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeModal = document.getElementById('closeModal');
        const saveProfileBtn = document.getElementById('saveProfileBtn');
        
        const nameInput = document.getElementById('nameInput');
        const usernameInput = document.getElementById('usernameInput');
        const avatarInput = document.getElementById('avatarInput');
        const avatarPreview = document.getElementById('avatarPreview');
        const themeSwitch = document.getElementById('themeSwitch');

        const profileTitle = document.getElementById('profileTitle');
        const profileDesc = document.getElementById('profileDesc');

        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('profileName');
            const savedUsername = localStorage.getItem('profileUsername');
            const savedAvatar = localStorage.getItem('profileAvatar');
            const savedTheme = localStorage.getItem('theme');

            if (savedName) {
                profileTitle.textContent = savedName;
                nameInput.value = savedName;
            }
            if (savedUsername) {
                profileDesc.textContent = savedUsername;
                usernameInput.value = savedUsername;
            }
            if (savedAvatar) {
                avatarPreview.src = savedAvatar;
            }
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                themeSwitch.checked = true;
            }
        });

        profileCard.addEventListener('click', () => modalOverlay.classList.add('active'));
        closeModal.addEventListener('click', () => modalOverlay.classList.remove('active'));

        avatarInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    avatarPreview.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        themeSwitch.addEventListener('change', () => {
            if (themeSwitch.checked) {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }
        });

        saveProfileBtn.addEventListener('click', () => {
            const name = nameInput.value.trim() || 'Профиль';
            const username = usernameInput.value.trim() || 'Настрой своё имя и username.';

            profileTitle.textContent = name;
            profileDesc.textContent = username;

            localStorage.setItem('profileName', name);
            localStorage.setItem('profileUsername', username);
            localStorage.setItem('profileAvatar', avatarPreview.src);
            localStorage.setItem('theme', themeSwitch.checked ? 'light' : 'dark');

            modalOverlay.classList.remove('active');
        });
    </script>
</body>
</html>
