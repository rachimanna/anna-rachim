<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANNA RACHIM</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161618;
            --card-border: #26262a;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --modal-bg: #1c1c1e;
        }

        body.light-theme {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --card-border: #e5e5ea;
            --text-main: #000000;
            --text-sub: #6c6c70;
            --modal-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg-color); color: var(--text-main); padding: 24px 16px; display: flex; justify-content: center; }

        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }

        .header { font-size: 20px; font-weight: 700; margin-bottom: 8px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.2s;
        }

        .card:active { transform: scale(0.96); background: #1c1c1e; }
        .light-theme .card:active { background: #f0f0f0; }

        .icon { font-size: 20px; }
        .title { font-size: 18px; font-weight: 600; }
        .description { font-size: 14px; color: var(--text-sub); line-height: 1.4; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s;
            z-index: 1000;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal {
            background: var(--modal-bg);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .modal-overlay.active .modal { transform: translateY(0); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
        .close-btn { background: none; border: none; color: var(--text-sub); font-size: 24px; cursor: pointer; }

        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .input-group label { font-size: 12px; color: var(--text-sub); }
        .input-group input { background: #26262a; border: none; border-radius: 12px; padding: 12px; color: var(--text-main); font-size: 14px; outline: none; }
        .light-theme .input-group input { background: #f2f2f7; color: #000; }

        .theme-toggle { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid var(--card-border); font-size: 14px; }
        .btn-save { background: var(--text-main); color: var(--bg-color); border: none; border-radius: 12px; padding: 14px; width: 100%; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">ANNA RACHIM</div>
        <div class="card">
            <div class="icon">✦</div>
            <div class="title">AI Assistant</div>
            <div class="description">Твой интеллектуальный помощник. Скоро здесь появится AI.</div>
        </div>
        <div class="card">
            <div class="icon">◇</div>
            <div class="title">Мои проекты</div>
            <div class="description">Создавай и сохраняй свои идеи в одном месте.</div>
        </div>
        <div class="card" onclick="openProfile()">
            <div class="icon">◎</div>
            <div class="title" id="profileTitle">Профиль</div>
            <div class="description" id="profileDesc">Настрой своё имя, username и внешний вид профиля.</div>
        </div>
        <div class="card">
            <div class="icon">↗</div>
            <div class="title">Активность</div>
            <div class="description">Здесь будет отображаться твоя активность.</div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <span>Редактировать профиль</span>
                <button class="close-btn" onclick="closeProfile()">&times;</button>
            </div>
            <div class="input-group">
                <label>Имя</label>
                <input type="text" id="nameInput" placeholder="Введи имя">
            </div>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="usernameInput" placeholder="@username">
            </div>
            <div class="theme-toggle">
                <span>Светлая тема</span>
                <input type="checkbox" id="themeSwitch" onchange="toggleTheme()">
            </div>
            <button class="btn-save" onclick="saveProfile()">Сохранить</button>
        </div>
    </div>

    <script>
        function openProfile() { document.getElementById('modalOverlay').classList.add('active'); }
        function closeProfile() { document.getElementById('modalOverlay').classList.remove('active'); }
        function toggleTheme() {
            if (document.getElementById('themeSwitch').checked) document.body.classList.add('light-theme');
            else document.body.classList.remove('light-theme');
        }
        function saveProfile() {
            const name = document.getElementById('nameInput').value.trim() || 'Профиль';
            const username = document.getElementById('usernameInput').value.trim() || 'Настрой своё имя и username.';
            document.getElementById('profileTitle').textContent = name;
            document.getElementById('profileDesc').textContent = username;
            localStorage.setItem('profileName', name);
            localStorage.setItem('profileUsername', username);
            localStorage.setItem('theme', document.getElementById('themeSwitch').checked ? 'light' : 'dark');
            closeProfile();
        }
        window.onload = function() {
            const savedName = localStorage.getItem('profileName');
            const savedUsername = localStorage.getItem('profileUsername');
            const savedTheme = localStorage.getItem('theme');
            if (savedName) { document.getElementById('profileTitle').textContent = savedName; document.getElementById('nameInput').value = savedName; }
            if (savedUsername) { document.getElementById('profileDesc').textContent = savedUsername; document.getElementById('usernameInput').value = savedUsername; }
            if (savedTheme === 'light') { document.body.classList.add('light-theme'); document.getElementById('themeSwitch').checked = true; }
        };
    </script>
</body>
</html>
